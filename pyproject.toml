[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentic-bi"
version = "0.1.0"
description = "Agentic BI system based on LangChain, LangGraph and MySQL"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "langchain==1.4.0",
    "langchain-core==1.6.2",
    "langchain-deepseek==1.1.0",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "langsmith>=0.4.43",
    "pydantic==2.13.4",
    "pydantic-settings>=2.10,<3",
    "python-dotenv==1.2.2",
    "SQLAlchemy>=2.0,<3",
    "PyMySQL==1.2.0",
    "mysql-connector-python==26.7.0",
    "sqlglot>=28,<30",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "seaborn==0.13.2",
    "wordcloud==1.9.6",
    "pillow==12.3.0",
    "PyYAML==6.0.3",
    "streamlit==1.63.0",
]

[project.scripts]
agentic-bi-analysis = "agentic_bi.agents.analysis.run:main"

[project.optional-dependencies]
nlp = [
    "pysentimiento",
    "bertopic",
    "sentence-transformers",
    "hdbscan",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio>=1.2,<2",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
    "mypy>=1.18,<2",
]


[tool.hatch.build.targets.wheel]
packages = ["src/agentic_bi"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]
allowed-confusables = ["，", "：", "；", "？", "（", "）"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = [
    "langchain_deepseek.*",
    "langchain_openai.*",
    "sqlglot.*",
    "yaml.*",
]
ignore_missing_imports = true
