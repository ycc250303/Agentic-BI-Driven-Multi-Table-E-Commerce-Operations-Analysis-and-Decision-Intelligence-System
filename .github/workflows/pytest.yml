name: pytest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: >
          pytest
          agents/common/tests
          agents/coordinator_agent/tests
          agents/decision_agent/tests
          agents/viz_agent/tests
          dashboard/tests
          -q
